<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title description">
<title id="title">Same challenge, different trade-offs</title>
<desc id="description">Both models correctly classify 33 of the same 40 AI-authored and AI-reviewed claims from 10 documents. Baseline and candidate correct counts: contradiction 8 and 6 out of 10; support 6 and 7 out of 10; insufficient evidence 19 and 20 out of 20. All 40 cases still require review. No human validation or automatic approval.</desc>
<rect width="1500" height="1100" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="90" y="65" font-size="18" fill="#496573" font-weight="bold" text-anchor="start">EVIDENCELENS  /  EXPLORATORY DIAGNOSTIC</text>
<text x="90" y="126" font-size="44" fill="#172b3a" font-weight="bold" text-anchor="start">Same challenge, different trade-offs</text>
<text x="90" y="168" font-size="24" fill="#496573" font-weight="normal" text-anchor="start">Same 40 claims  ·  10 source documents  ·  AI-authored and AI-reviewed labels</text>
<rect x="90" y="208" width="24" height="24" rx="3" fill="#117c83"/>
<text x="126" y="229" font-size="22" fill="#172b3a" font-weight="normal" text-anchor="start">Retained baseline</text>
<rect x="520" y="208" width="24" height="24" rx="3" fill="#6958a5"/>
<text x="556" y="229" font-size="22" fill="#172b3a" font-weight="normal" text-anchor="start">Experimental context candidate</text>
<text x="90" y="300" font-size="21" fill="#496573" font-weight="normal" text-anchor="start">Correctly classified claims</text>
<line x1="160" y1="750" x2="1380" y2="750" stroke="#c6d2d8" stroke-width="2"/>
<text x="135" y="758" font-size="22" fill="#496573" font-weight="normal" text-anchor="end">0</text>
<line x1="160" y1="650" x2="1380" y2="650" stroke="#e4eaed" stroke-width="1"/>
<text x="135" y="658" font-size="22" fill="#496573" font-weight="normal" text-anchor="end">5</text>
<line x1="160" y1="550" x2="1380" y2="550" stroke="#e4eaed" stroke-width="1"/>
<text x="135" y="558" font-size="22" fill="#496573" font-weight="normal" text-anchor="end">10</text>
<line x1="160" y1="450" x2="1380" y2="450" stroke="#e4eaed" stroke-width="1"/>
<text x="135" y="458" font-size="22" fill="#496573" font-weight="normal" text-anchor="end">15</text>
<line x1="160" y1="350" x2="1380" y2="350" stroke="#e4eaed" stroke-width="1"/>
<text x="135" y="358" font-size="22" fill="#496573" font-weight="normal" text-anchor="end">20</text>
<rect x="258" y="590" width="92" height="160" rx="3" fill="#117c83"/>
<text x="304" y="572" font-size="28" fill="#117c83" font-weight="bold" text-anchor="middle">8/10</text>
<rect x="366" y="630" width="92" height="120" rx="3" fill="#6958a5"/>
<text x="412" y="612" font-size="28" fill="#6958a5" font-weight="bold" text-anchor="middle">6/10</text>
<text x="360" y="796" font-size="25" fill="#172b3a" font-weight="bold" text-anchor="middle">Contradiction</text>
<text x="360" y="832" font-size="20" fill="#496573" font-weight="normal" text-anchor="middle">10 reference-labelled claims</text>
<rect x="668" y="630" width="92" height="120" rx="3" fill="#117c83"/>
<text x="714" y="612" font-size="28" fill="#117c83" font-weight="bold" text-anchor="middle">6/10</text>
<rect x="776" y="610" width="92" height="140" rx="3" fill="#6958a5"/>
<text x="822" y="592" font-size="28" fill="#6958a5" font-weight="bold" text-anchor="middle">7/10</text>
<text x="770" y="796" font-size="25" fill="#172b3a" font-weight="bold" text-anchor="middle">Support</text>
<text x="770" y="832" font-size="20" fill="#496573" font-weight="normal" text-anchor="middle">10 reference-labelled claims</text>
<rect x="1078" y="370" width="92" height="380" rx="3" fill="#117c83"/>
<text x="1124" y="352" font-size="28" fill="#117c83" font-weight="bold" text-anchor="middle">19/20</text>
<rect x="1186" y="350" width="92" height="400" rx="3" fill="#6958a5"/>
<text x="1232" y="332" font-size="28" fill="#6958a5" font-weight="bold" text-anchor="middle">20/20</text>
<text x="1180" y="796" font-size="25" fill="#172b3a" font-weight="bold" text-anchor="middle">Insufficient evidence</text>
<text x="1180" y="832" font-size="20" fill="#496573" font-weight="normal" text-anchor="middle">20 reference-labelled claims</text>
<line x1="90" y1="875" x2="1410" y2="875" stroke="#dce4e8" stroke-width="1"/>
<text x="90" y="922" font-size="29" fill="#172b3a" font-weight="bold" text-anchor="start">33/40 correct overall for both models</text>
<text x="90" y="965" font-size="23" fill="#496573" font-weight="normal" text-anchor="start">Baseline retained before evaluation. Experimental candidate not promoted.</text>
<text x="90" y="1005" font-size="23" fill="#496573" font-weight="normal" text-anchor="start">All 40 cases require review; no automatic approvals.</text>
<text x="90" y="1054" font-size="21" fill="#496573" font-weight="normal" text-anchor="start">Small constructed sample. Observed counts are not human validation or evidence of production safety.</text>
</g>
</svg>
